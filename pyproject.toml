[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "faire-cuan"
version = "0.1.0"
description = "Verify, mirror, and process externally-signed OCI artifacts for Tekton pipelines"
requires-python = ">=3.11"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
faire-cuan = "faire_cuan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
